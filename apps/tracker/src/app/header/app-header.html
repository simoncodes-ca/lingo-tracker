<mat-toolbar class="app-toolbar">
  <div class="toolbar-content">
    <!-- Logo and Title -->
    <a class="brand" [routerLink]="['/collections']" [attr.aria-label]="TOKENS.HEADER.GOTOCOLLECTIONS | transloco" [matTooltip]="TOKENS.HEADER.GOTOCOLLECTIONS | transloco">
      <img src="assets/logo.png" class="logo-icon logo-light" alt="LingoTracker logo" />
      <img src="assets/logo-dark.png" class="logo-icon logo-dark" alt="LingoTracker logo" />
      <h1 class="app-title">LingoTracker</h1>
    </a>

    <!-- Collection context: pipe + name + folder -->
    @if (hasCollectionContext()) {
      <div class="collection-pipe" aria-hidden="true"></div>

      <!-- Back to Collections -->
      <button mat-icon-button [routerLink]="['/collections']" [attr.aria-label]="TOKENS.HEADER.BACKTOCOLLECTIONS | transloco" [matTooltip]="TOKENS.HEADER.BACKTOCOLLECTIONS | transloco" class="back-button">
        <mat-icon>arrow_back</mat-icon>
      </button>

      <div class="collection-context">
        <span class="collection-name" [title]="collectionName() ?? ''">{{ collectionName() }}</span>
        <span class="context-separator" aria-hidden="true">·</span>
        <span class="collection-folder" [title]="translationsFolder() ?? ''">{{ translationsFolder() }}</span>
      </div>
    }

    <!-- Spacer -->
    <span class="toolbar-spacer"></span>

    <!-- Stat chips (next to gear) -->
    @if (hasCollectionContext()) {
      <div class="header-stats">
        @if (statsLoading()) {
          <div class="skeleton-chip" aria-hidden="true"></div>
          <div class="skeleton-chip" aria-hidden="true"></div>
        } @else if (totalKeys() !== null) {
          <span class="stat-chip">{{ keysText() }}</span>
          <span class="stat-chip">{{ localesText() }}</span>
        }
      </div>
    }

    <!-- App controls: language, appearance, settings -->
    <div class="collection-pipe collection-pipe--static" aria-hidden="true"></div>

    <div class="toolbar-actions">
      <locale-picker />

      <button
        mat-icon-button
        [matMenuTriggerFor]="themeMenu"
        [attr.aria-label]="TOKENS.THEME.CURRENTTHEMEX | transloco: { theme: themeModeToken() | transloco }"
        [matTooltip]="TOKENS.THEME.CURRENTTHEMEX | transloco: { theme: themeModeToken() | transloco }"
        class="toolbar-action"
      >
        <mat-icon>{{ themeIcon() }}</mat-icon>
      </button>

      <!--
        Inert on the settings page itself. `disabledInteractive` keeps it
        focusable and announces aria-disabled rather than dropping it out of the
        tab order, and aria-current says why it is inert.
      -->
      <button
        mat-icon-button
        [routerLink]="['/settings']"
        routerLinkActive
        #settingsLink="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: true }"
        [disabled]="settingsLink.isActive"
        disabledInteractive
        [attr.aria-current]="settingsLink.isActive ? 'page' : null"
        [attr.aria-label]="TOKENS.SETTINGS.TITLE | transloco"
        [matTooltip]="TOKENS.SETTINGS.TITLE | transloco"
        class="toolbar-action"
      >
        <mat-icon>settings</mat-icon>
      </button>
    </div>

    <mat-menu #themeMenu="matMenu">
      <button mat-menu-item (click)="setTheme('light')" [class.active]="isThemeActive('light')">
        <mat-icon>light_mode</mat-icon>
        <span>{{ TOKENS.THEME.LIGHT | transloco }}</span>
        @if (isThemeActive('light')) {
          <mat-icon class="check-icon">check</mat-icon>
        }
      </button>

      <button mat-menu-item (click)="setTheme('dark')" [class.active]="isThemeActive('dark')">
        <mat-icon>dark_mode</mat-icon>
        <span>{{ TOKENS.THEME.DARK | transloco }}</span>
        @if (isThemeActive('dark')) {
          <mat-icon class="check-icon">check</mat-icon>
        }
      </button>

      <button mat-menu-item (click)="setTheme('system')" [class.active]="isThemeActive('system')">
        <mat-icon>computer</mat-icon>
        <span>{{ TOKENS.THEME.SYSTEM | transloco }}</span>
        @if (isThemeActive('system')) {
          <mat-icon class="check-icon">check</mat-icon>
        }
      </button>
    </mat-menu>
  </div>
</mat-toolbar>
